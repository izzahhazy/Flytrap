<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HX3-F29 Fly Trap Inspection Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a24;--green:#1b5e3a;--bg:#f5f5f0;--line:#cfd3cc;--mut:#6b736d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px}
.app{max-width:1100px;margin:0 auto;padding:12px}
.banner{border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:14px;border:1px solid}
.banner.ok{background:#e3f1e8;border-color:#9fd0b0;color:#1b4d2e}
.banner.warn{background:#fff6dd;border-color:#e6cf86;color:#6b5200}
.banner.err{background:#fde8e6;border-color:#e6a39c;color:#7a1f16}
.hdr{display:flex;background:#fff;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:14px}
.hdr .l{flex:1;padding:18px 18px}
.hdr .l b{display:block;font-size:17px;margin-bottom:4px}
.hdr .l span{color:var(--green);font-weight:600;font-size:17px}
.hdr .r{width:250px;border-left:1px solid var(--ink)}
.hdr .r div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.hdr .r div:last-child{border:0}
.hdr .r em{font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.tabs button{padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mut);font:600 15px Inter,Arial;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:500}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input[type=text],input:not([type]){width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.pill{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 14px Inter,Arial;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.x.on{background:#c62828;border-color:#c62828;color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px}
.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:14px 18px;font:600 15px Inter,Arial;cursor:pointer;width:100%}
.sec{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:600 14px Inter,Arial;cursor:pointer;text-decoration:none;display:inline-block}
.danger{color:#c62828;border-color:#e6a39c}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;margin:2px 0}
.kpi span{font-size:12px;color:var(--mut)}
.up{color:#c62828}.down{color:#1b5e3a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.hm{border-collapse:collapse;font-size:12px;min-width:560px;width:100%}
.hm th,.hm td{border:1px solid var(--line);padding:5px 4px;text-align:center}
.hm th{background:#f0f2ee;font-weight:600}
.hm td.l{text-align:left;white-space:nowrap}
.tw{overflow-x:auto}
.st span{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-bottom:4px}
.st>div{display:flex;gap:4px}
.st button{width:44px;height:48px;flex:none;border:1px solid var(--line);background:#f0f2ee;border-radius:8px;font:600 22px Inter,Arial;cursor:pointer;color:var(--ink);touch-action:manipulation}
.st button:active{background:var(--ink);color:#fff}
.st input{text-align:center;font-size:18px;font-weight:600;height:48px;padding:0;min-width:0;flex:1;width:100%}
.adm h3{margin:16px 0 8px}
.adm .rowl{display:grid;grid-template-columns:70px 1fr 44px;gap:6px;margin-bottom:6px}
.adm .rowl button{border:1px solid var(--line);background:#fff;border-radius:8px;color:#c62828;font-size:18px;cursor:pointer}
.adm .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{padding:10px 12px;border-radius:8px;background:#e3f1e8;color:#1b4d2e;font-size:13px;margin-bottom:10px}
.msg.bad{background:#fde8e6;color:#7a1f16}
#appTitle{text-transform:capitalize}
.hide{display:none!important}
.small{font-size:12px;color:var(--mut)}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
@media(max-width:640px){
 .hdr{flex-direction:column}.hdr .r{width:auto;border-left:0;border-top:1px solid var(--ink)}
 .grid4{grid-template-columns:repeat(2,1fr)}.grid8{grid-template-columns:repeat(4,1fr)}
}

/* ===== printable form (same as original) ===== */
.wrap{overflow-x:auto;padding:4px 0}
.sheet{background:#fff;width:277mm;min-width:277mm;margin:0 auto 14px;font-size:8.5px;color:#000;font-family:Arial,Helvetica,sans-serif}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td{border:1px solid #000;padding:1px 2px;text-align:center;vertical-align:middle;overflow:hidden}
.sheet table.hd{margin:0 0 -1px 0}
.sheet table.hd td{height:4.6mm;padding:0 3px;text-align:left;font-size:9px;font-weight:normal;white-space:nowrap}
.sheet table.hd td.co{text-align:center;font-weight:bold;font-size:10.5px;white-space:normal}
.sheet{padding:0;line-height:normal}
.sheet .b{font-weight:bold}
.sheet .gft{font-weight:bold;font-size:8px;line-height:1.1}
.sheet .cat{text-align:left;padding-left:4px}
.sheet td.c{height:var(--rh,4.5mm);padding:0}
.sheet input{border:0;background:transparent;padding:0;border-radius:0;text-align:center;font:9px Arial;color:#000;pointer-events:none;width:100%;height:100%}
.sheet .wk{display:flex;justify-content:space-around;align-items:center;font-size:8px;line-height:1}
.pk{display:inline-block;min-width:10px;height:11px;line-height:11px;text-align:center;position:relative}
.pk.on.w{border:1px solid #000;border-radius:50%}
.pk.on.u{font-weight:bold}
.pk.on.u::after{content:"X";position:absolute;inset:0;font-weight:bold;font-size:12px;line-height:11px;color:#c00}
.uv{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:0;font-size:6.5px;padding:3px 0;white-space:nowrap}
.uv .pk{min-width:0;padding:0 .6px;height:9px;line-height:9px}
.uv .pk.on.u::after{font-size:9px;line-height:9px}
.act{text-align:left!important;font-size:7.5px;line-height:1.25;padding:2px 3px!important;vertical-align:top!important}
.act label{display:flex;gap:2px;align-items:flex-start;margin:0 0 1px;pointer-events:none}
.act input[type=checkbox]{margin:0;width:9px;height:9px;flex:none}
.act input[type=text]{border-bottom:1px dotted #000;font-size:8px;text-align:left}
.sheet td.sign{height:9mm}
.note{font-size:9px;margin-top:3px}
.sheet .yrline{font-size:9px;margin:4mm 0 3mm 2px;height:4mm}
.sheet .yrline input{display:inline-block;width:60px;height:12px;font:9px Arial;text-align:left;margin-left:2px}
@page{size:A4 landscape;margin:8mm}
@media print{
 body{background:#fff}
 .app>*:not(#v-print){display:none!important}
 #v-print .noprint{display:none!important}
 .wrap{overflow:visible}
 .sheet{margin:0;page-break-after:always;break-after:page}
 .sheet:last-child{page-break-after:auto;break-after:auto}
 .app{padding:0;max-width:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div class="app">
 <div id="banner" class="banner warn">Loading…</div>

 <div class="hdr">
  <div class="l"><b id="appCo">HEXA FOOD SDN BHD (HEXA 3)</b><span id="appTitle">Fly Trap Inspection Record — Digital</span></div>
  <div class="r"><div>Form No.<em id="appDoc">HX3-F29</em></div><div>Issue No.<em id="appIssue">3</em></div><div>Issue Date<em id="appDate">01/01/2026</em></div></div>
 </div>

 <div class="tabs">
  <button class="on" data-tab="fill">Fill checklist</button>
  <button data-tab="print">Records / Print</button>
  <button data-tab="sheet">Google Sheet</button>
  <button data-tab="trend">Trend Analysis</button>
  <button data-tab="admin">🔒 Edit Form</button>
 </div>

 <!-- FILL -->
 <div id="v-fill">
  <div class="small" id="sync" style="margin:0 2px 8px"></div>
  <div class="card"><div class="row">
   <label class="f" style="width:100px">Year<input id="yr1" inputmode="numeric" maxlength="4"></label>
   <label class="f" style="flex:1;min-width:150px">Month<select id="mon"></select></label>
  </div>
  <div style="margin-top:12px"><div class="small" style="margin-bottom:6px">Column (each month has 2 columns on the form)</div>
   <div class="seg" id="slot"></div></div>
  <div style="margin-top:12px"><div class="small" style="margin-bottom:6px">Week</div>
   <div class="seg" id="week"></div></div>
  </div>
  <div id="fillbody"></div>
 </div>

 <!-- PRINT -->
 <div id="v-print" class="hide">
  <div class="card noprint"><div class="row">
   <label class="f" style="width:100px">Year<input id="yr2" inputmode="numeric" maxlength="4"></label>
   <button class="sec" id="btnPrint">Print (A4 landscape, 4 pages)</button>
  </div><div class="small" style="margin-top:8px">Print output follows the original paper form.</div></div>
  <div class="wrap" id="sheets"></div>
 </div>

 <!-- TREND -->
 <div id="v-trend" class="hide">
  <div class="card"><div class="row">
   <label class="f" style="width:100px">Year<input id="yr3" inputmode="numeric" maxlength="4"></label>
   <label class="f" style="flex:1;min-width:130px">Pest type<select id="tt"><option value="all">All types</option></select></label>
   <label class="f" style="flex:1;min-width:130px">Location<select id="tl"><option value="all">All locations</option></select></label>
  </div></div>
  <div id="trendbody"></div>
 </div>

 <!-- ADMIN -->
 <div id="v-admin" class="hide adm"><div id="adminbody"></div></div>

 <!-- SHEET -->
 <div id="v-sheet" class="hide">
  <div class="card" id="sheetcard"></div>
 </div>
</div>

<script>
// ===== CONFIG =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnMVB3aUwkbzfKqNsNGs_ziiiWBNf4aBoBOc5NPXL-LjRpe7eKZRC7daQAOHpD2Gam/exec"; // URL Google Apps Script Web App (Code.gs)
const SHEET_URL  = "https://docs.google.com/spreadsheets/d/1RDmTQKQFQFoGxTy34GPUW8H4_T9TCN0iaYMKp8k29nM/edit?usp=sharing"; // URL Google Sheet (untuk tab Google Sheet)
// ==================
const MONTHS=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DEF={company:'HEXA FOOD SDN BHD (HEXA 3)',title:'FLY TRAP INSPECTION RECORD',docNo:'HX3-F29',issueNo:'3',issueDate:'01/01/2026',pages:'9',uvCount:8,
 noteA:'Note for UV Light : Lamp must be functioning well (no broken, not blinking)',noteB:'Noted : Lamp must be functioning well (no broken, not blinking)',
 types:{Flies:'Flies',Weevils:'Weevils',Bugs:'Bugs',Others:'Others'},nextLocId:9,
 locs:[["1","Changing Room"],["2","Mixing room"],["3","Raw Material Storage"],["4","Allergen Production"],["5","Walkway F2"],["6","Glass Jar and 4in1 Production"],["7","Reception Area"],["8","Ziplock Production"]].map(([id,name])=>({id,label:id,name}))};
const clone=o=>JSON.parse(JSON.stringify(o));
const mergeCfg=c=>({...clone(DEF),...c,types:{...DEF.types,...((c&&c.types)||{})},locs:(c&&c.locs&&c.locs.length)?c.locs:clone(DEF.locs)});
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
let CFG=clone(DEF); try{const lc=localStorage.getItem('hx3f29cfg'); if(lc)CFG=mergeCfg(JSON.parse(lc))}catch(e){}
const LOC=[]; // [id,name,label]
function syncLOC(){LOC.length=0;CFG.locs.forEach(l=>LOC.push([l.id,l.name,l.label||l.id]))}
syncLOC();
const TL=t=>CFG.types[t]||t;
const UVN=()=>Array.from({length:CFG.uvCount},(_,i)=>i+1);
const TYPES=["Flies","Weevils","Bugs","Others"];
const $=s=>document.querySelector(s);
let year=String(new Date().getFullYear()), S={}, fm=new Date().getMonth(), fs=0, conn='none';

/* ---------- state + auto sync ---------- */
const lk=()=>'hx3f29-'+year, dk=()=>'hx3f29d-'+year;
let dirty={}, flushing=false, timer=null, lastSync='';
function saveLocal(){S.year=year;try{localStorage.setItem(lk(),JSON.stringify(S));localStorage.setItem(dk(),JSON.stringify(dirty))}catch(e){}}
function status(m){const e=$('#sync');if(e)e.textContent=m}
function mark(k,v){
 const del=(v===''||v==null||v===false);
 if(del) delete S[k]; else S[k]=v;
 dirty[k]=del?null:v; saveLocal(); sched();
}
const setKey=mark;
function sched(){ if(!SCRIPT_URL)return; status('Saving…'); clearTimeout(timer); timer=setTimeout(flush,1200); }
async function flush(){
 if(!SCRIPT_URL||flushing)return;
 const patch={...dirty}; if(!Object.keys(patch).length)return;
 flushing=true;
 try{
  const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({year,patch})});
  const j=await r.json(); if(!j.ok) throw new Error('fail');
  Object.keys(patch).forEach(k=>{ if(JSON.stringify(dirty[k])===JSON.stringify(patch[k])) delete dirty[k]; });
  conn='ok'; banner(); saveLocal();
  if(j.data) mergeRemote(j.data);
  status(Object.keys(dirty).length?'Saving…':'✓ Synced '+new Date().toLocaleTimeString());
 }catch(e){ conn='err'; banner(); status('Offline — will retry automatically'); setTimeout(flush,10000); }
 flushing=false;
 if(Object.keys(dirty).length&&conn==='ok') sched();
}
function mergeRemote(remote){
 Object.keys(remote).forEach(k=>{ if(!(k in dirty)) S[k]=remote[k]; });
 Object.keys(S).forEach(k=>{ if(k!=='year'&&!(k in remote)&&!(k in dirty)) delete S[k]; });
 S.year=year; saveLocal(); refreshUI();
}
function refreshUI(){
 applyPrint();
 if(!$('#v-trend').classList.contains('hide'))renderTrend();
 const a=document.activeElement;
 if(a&&a.tagName==='INPUT'&&$('#fillbody').contains(a)){
  document.querySelectorAll('#fillbody [data-k]').forEach(e=>{
   if(e===a)return; const v=S[e.dataset.k];
   if(e.type==='checkbox')e.checked=!!v; else e.value=v||'';
  });
  document.querySelectorAll('#fillbody [data-uv]').forEach(e=>e.classList.toggle('on',!!S[e.dataset.uv]));
  const [h,c]=hc();
  document.querySelectorAll('#week [data-week]').forEach(e=>e.classList.toggle('on',!!S[`wk-${h}-${c}-${e.dataset.week}`]));
 } else renderFill();
}
async function pull(){
 if(!SCRIPT_URL||flushing||document.hidden)return;
 try{
  const r=await fetch(SCRIPT_URL+'?year='+encodeURIComponent(year));
  const j=await r.json(); conn='ok'; banner();
  if(j){ adm.hasPw=!!j.hasPassword; if(j.config) cfgFromServer(j.config); }
  if(j&&j.data) mergeRemote(j.data);
  if(!Object.keys(dirty).length) status('✓ Synced '+new Date().toLocaleTimeString());
 }catch(e){conn='err';banner();status('Offline — will retry automatically')}
}
async function loadYear(){
 try{S=JSON.parse(localStorage.getItem(lk())||'{}')}catch(e){S={}}
 try{dirty=JSON.parse(localStorage.getItem(dk())||'{}')}catch(e){dirty={}}
 conn=SCRIPT_URL?'wait':'none'; banner(); S.year=year; renderFill(); applyPrint();
 if(SCRIPT_URL){ await pull(); if(Object.keys(dirty).length) flush(); }
 else status('Saved on this device only');
}
async function saveRemote(){ if(!SCRIPT_URL){alert('Google Sheet is not connected yet. Saved on this device only.');return} await flush(); await pull(); }
setInterval(pull,8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
function banner(){
 const b=$('#banner');
 const m={ok:['ok','Connected to Google Sheet. Records are saved online and shared with anyone using this same connection.'],
  none:['warn','Google Sheet is not connected yet. Records are saved on this device only.'],
  wait:['warn','Connecting to Google Sheet…'],
  err:['err','Could not reach Google Sheet. Showing records saved on this device.']}[conn];
 b.className='banner '+m[0]; b.textContent=m[1];
}

/* ---------- fill tab ---------- */
const hc=()=>{const h=fm<6?0:1;return [h,(fm%6)*2+fs]};
function initFillControls(){
 $('#mon').innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
 $('#mon').value=fm;
 $('#mon').onchange=e=>{fm=+e.target.value;renderFill()};
 $('#slot').innerHTML=[0,1].map(i=>`<button data-slot="${i}">Column ${i+1}</button>`).join('');
 $('#slot').onclick=e=>{const b=e.target.closest('[data-slot]');if(b){fs=+b.dataset.slot;renderFill()}};
 $('#week').onclick=e=>{
  const b=e.target.closest('[data-week]');if(!b)return;
  const [h,c]=hc();
  const was=!!S[`wk-${h}-${c}-${b.dataset.week}`];
  for(let n=1;n<=5;n++) if(S[`wk-${h}-${c}-${n}`]) mark(`wk-${h}-${c}-${n}`,'');
  if(!was) mark(`wk-${h}-${c}-${b.dataset.week}`,1);
  renderFill();
 };
}
function renderFill(){
 const [h,c]=hc();
 $('#mon').value=fm;$('#yr1').value=year;
 document.querySelectorAll('#slot button').forEach(b=>b.classList.toggle('on',+b.dataset.slot===fs));
 $('#week').innerHTML=[1,2,3,4,5].map(n=>`<button data-week="${n}" class="${S[`wk-${h}-${c}-${n}`]?'on':''}">Week ${n}</button>`).join('');
 const v=k=>(S[k]||'').toString().replace(/"/g,'&quot;');
 let t=`<div class="card"><h3>Pest count per trap</h3><div class="small" style="margin-bottom:8px">Tap + / − to count. Press “Fill empty with 0” first, then only change the traps that caught pests.</div><button type="button" class="sec" data-zero="1" style="width:100%;margin-bottom:14px">Fill empty with 0</button>`;
 LOC.forEach(([n,name,lb])=>{
  t+=`<div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:6px">${lb} · ${name}</div><div class="grid4">`+
   TYPES.map(ty=>{const k=`p-${h}-${n}-${ty}-${c}`;return `<div class="st"><span>${TL(ty)}</span><div><button type="button" data-step="-1" data-sk="${k}">−</button><input data-k="${k}" value="${v(k)}" inputmode="numeric" placeholder="–"><button type="button" data-step="1" data-sk="${k}">+</button></div></div>`}).join('')+`</div></div>`;
 });
 t+=`</div><div class="card"><h3>UV Light condition</h3><div class="small" style="margin-bottom:8px">Tap the GFT No. if the lamp is NOT OK (marked X).</div>`;
 [1,2].forEach(L=>{
  t+=`<div style="font-weight:600;margin:8px 0 6px">Lamp ${L}</div><div class="grid8">`+
   UVN().map(n=>{const k=`uv${L}-${h}-${c}-${n}`;return `<button class="pill x ${S[k]?'on':''}" data-uv="${k}">${n}</button>`}).join('')+`</div>`;
 });
 t+=`<div class="small" style="margin-top:10px">Lamp must be functioning well (no broken, not blinking).</div></div>`;
 const a=`ac-${h}-${c}`;
 t+=`<div class="card"><h3>Action taken</h3>`+
  [['gb','Change glue board'],['l1','Change Lamp 1'],['l2','Change Lamp 2'],['ot','Others']].map(([s,l])=>`<label class="chk"><input type="checkbox" data-k="${a}-${s}" ${S[`${a}-${s}`]?'checked':''}>${l}</label>`).join('')+
  `<input data-k="${a}-tx" placeholder="Others: …" value="${v(a+'-tx')}" style="margin-top:6px"></div>`+
  `<div class="card"><div class="row"><label class="f" style="flex:1;min-width:140px">Checked by<input data-k="cb-${h}-${c}" value="${v(`cb-${h}-${c}`)}"></label>
   <label class="f" style="flex:1;min-width:140px">Verified by<input data-k="vb-${h}-${c}" value="${v(`vb-${h}-${c}`)}"></label></div></div>`+
  `<button class="sec" id="btnSave" style="width:100%">Sync now</button><div class="small" style="margin:8px 2px 14px">Changes are saved automatically and shared with all devices.</div><button class="sec danger" id="btnClear" style="width:100%;margin-bottom:24px">Clear this column</button>`;
 $('#fillbody').innerHTML=t;
 $('#btnSave').onclick=saveRemote;
 $('#btnClear').onclick=()=>{
  const [h,c]=hc();
  if(!confirm(`Clear ALL entries for ${MONTHS[fm]}, Column ${fs+1} (${year})? This cannot be undone.`))return;
  const re=new RegExp(`^(wk-${h}-${c}-\\d|p-${h}-\\d+-[A-Za-z]+-${c}|uv[12]-${h}-${c}-\\d|ac-${h}-${c}-\\w+|[cv]b-${h}-${c})$`);
  Object.keys(S).filter(k=>re.test(k)).forEach(k=>mark(k,''));
  renderFill();
 };
}

$('#fillbody').addEventListener('click',e=>{

 const st=e.target.closest('[data-step]');

/* ---------- trend analysis ---------- */
const MON3=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const TCOL={Flies:'#1b5e3a',Weevils:'#e08a00',Bugs:'#8e44ad',Others:'#607d8b'};
function fillTrendSelects(){
 const a=$('#tt').value,b=$('#tl').value;
 $('#tt').innerHTML='<option value="all">All types</option>'+TYPES.map(t=>`<option value="${t}">${TL(t)}</option>`).join('');
 $('#tl').innerHTML='<option value="all">All locations</option>'+LOC.map(([n,nm,lb])=>`<option value="${n}">${lb} · ${nm}</option>`).join('');
 if([...$('#tt').options].some(o=>o.value===a))$('#tt').value=a;
 if([...$('#tl').options].some(o=>o.value===b))$('#tl').value=b;
}
$('#tt').onchange=$('#tl').onchange=renderTrend;
const num=v=>{const x=parseFloat(v);return isFinite(x)&&x>0?x:0};
function renderTrend(){
 $('#yr3').value=year;
 const tt=$('#tt').value, tl=$('#tl').value;
 const types=tt==='all'?TYPES:[tt], locs=tl==='all'?LOC:LOC.filter(l=>l[0]===tl);
 // periods 0..23 : h*12+c ; month = h*6+floor(c/2)
 const P=[];
 for(let h=0;h<2;h++)for(let c=0;c<12;c++){
  const o={h,c,month:h*6+Math.floor(c/2),slot:c%2,by:{},tot:0,rec:false};
  TYPES.forEach(t=>o.by[t]=0);
  locs.forEach(([n])=>types.forEach(t=>{const v=num(S[`p-${h}-${n}-${t}-${c}`]);o.by[t]+=v;o.tot+=v}));
  for(let w=1;w<=5;w++) if(S[`wk-${h}-${c}-${w}`]) o.rec=true;
  LOC.forEach(([n])=>TYPES.forEach(t=>{if(S[`p-${h}-${n}-${t}-${c}`]!=null&&S[`p-${h}-${n}-${t}-${c}`]!=='')o.rec=true}));
  P.push(o);
 }
 const rec=P.filter(p=>p.rec), total=P.reduce((a,p)=>a+p.tot,0);
 if(!rec.length){ $('#trendbody').innerHTML=`<div class="card">No records for ${year} yet. Fill in the checklist and trends will appear here.</div>`; return; }
 const peak=rec.reduce((a,p)=>p.tot>a.tot?p:a,rec[0]);
 const lt={}; LOC.forEach(([n])=>lt[n]=0);
 P.forEach(p=>locs.forEach(([n])=>types.forEach(t=>lt[n]+=num(S[`p-${p.h}-${n}-${t}-${p.c}`]))));
 const topLoc=locs.reduce((a,l)=>lt[l[0]]>lt[a[0]]?l:a,locs[0]);
 const last=rec[rec.length-1], prev=rec[rec.length-2];
 let chg='—',cls='';
 if(prev){ if(prev.tot===0) chg=last.tot===0?'0%':'New'; else{const d=Math.round((last.tot-prev.tot)/prev.tot*100);chg=(d>0?'+':'')+d+'%';cls=d>0?'up':d<0?'down':''} }
 const lab=p=>`${MON3[p.month]} · Col ${p.slot+1}`;
 // UV + actions
 const uv={1:{},2:{}};let gb=0,l1=0,l2=0;
 [1,2].forEach(L=>UVN().forEach(n=>uv[L][n]=0));
 P.forEach(p=>{
  [1,2].forEach(L=>{for(let n=1;n<=CFG.uvCount;n++) if(S[`uv${L}-${p.h}-${p.c}-${n}`]) uv[L][n]++});
  const k=`ac-${p.h}-${p.c}`; if(S[k+'-gb'])gb++; if(S[k+'-l1'])l1++; if(S[k+'-l2'])l2++;});
 // stacked bar chart
 const W=720,H=250,ml=34,mb=34,mt=12,mr=8,bw=(W-ml-mr)/24;
 let max=Math.max(1,...P.map(p=>p.tot)); const step=Math.pow(10,Math.floor(Math.log10(max))); max=Math.ceil(max/step)*step;
 const y=v=>mt+(H-mt-mb)*(1-v/max);
 let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
 for(let i=0;i<=4;i++){const v=max*i/4;svg+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e6e1"/><text x="${ml-4}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#6b736d">${Math.round(v*10)/10}</text>`}
 P.forEach((p,i)=>{
  const x=ml+i*bw+1.5; let acc=0;
  types.forEach(t=>{const v=p.by[t];if(!v)return;svg+=`<rect x="${x}" y="${y(acc+v)}" width="${bw-3}" height="${y(acc)-y(acc+v)}" fill="${TCOL[t]}"><title>${lab(p)} · ${TL(t)}: ${v}</title></rect>`;acc+=v});
  if(p.tot) svg+=`<text x="${x+(bw-3)/2}" y="${y(p.tot)-3}" font-size="8" text-anchor="middle" fill="#1f2a24">${p.tot}</text>`;
  if(!p.rec) svg+=`<text x="${x+(bw-3)/2}" y="${y(0)-3}" font-size="7" text-anchor="middle" fill="#b0b5ae">–</text>`;
  if(p.slot===0) svg+=`<text x="${x+bw-1.5}" y="${H-mb+13}" font-size="9" text-anchor="middle" fill="#1f2a24">${MON3[p.month]}</text>`;
 });
 svg+=`<line x1="${ml}" x2="${W-mr}" y1="${y(0)}" y2="${y(0)}" stroke="#1f2a24"/></svg>`;
 const legend=`<div class="legend">`+types.map(t=>`<span><i style="background:${TCOL[t]}"></i>${TL(t)}</span>`).join('')+`</div>`;
 // heatmap location x month
 const hm={}; LOC.forEach(([n])=>hm[n]=Array(12).fill(0));
 P.forEach(p=>locs.forEach(([n])=>types.forEach(t=>hm[n][p.month]+=num(S[`p-${p.h}-${n}-${t}-${p.c}`]))));
 let hmax=1; locs.forEach(([n])=>hm[n].forEach(v=>hmax=Math.max(hmax,v)));
 const shade=v=>v?`background:rgba(198,40,40,${(0.12+0.6*v/hmax).toFixed(2)})`:'';
 let ht=`<table class="hm"><tr><th>Location</th>${MON3.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr>`;
 locs.forEach(([n,nm,lb])=>{ht+=`<tr><td class="l">${lb} · ${nm}</td>`+hm[n].map(v=>`<td style="${shade(v)}">${v||''}</td>`).join('')+`<td><b>${lt[n]}</b></td></tr>`});
 ht+=`</table>`;
 // uv table
 let ut=`<table class="hm" style="min-width:380px"><tr><th>Lamp (times X)</th>${UVN().map(n=>`<th>${n}</th>`).join('')}</tr>`;
 [1,2].forEach(L=>{ut+=`<tr><td class="l">Lamp ${L}</td>`+UVN().map(n=>`<td style="${uv[L][n]?`background:rgba(198,40,40,${Math.min(.75,.2+uv[L][n]*.15)})`:''}">${uv[L][n]||''}</td>`).join('')+`</tr>`});
 ut+=`</table>`;
 $('#trendbody').innerHTML=`
 <div class="kpis">
  <div class="kpi"><span>Total pests (${year})</span><b>${total}</b><span>${rec.length} periods recorded</span></div>
  <div class="kpi"><span>Latest vs previous</span><b class="${cls}">${chg}</b><span>${prev?lab(prev)+' → '+lab(last):lab(last)}</span></div>
  <div class="kpi"><span>Peak period</span><b>${lab(peak)}</b><span>${peak.tot} pests</span></div>
  <div class="kpi"><span>Highest location</span><b>${lt[topLoc[0]]?topLoc[2]+' · '+topLoc[1]:'—'}</b><span>${lt[topLoc[0]]} pests</span></div>
 </div>
 <div class="card"><h3>Pest count per inspection</h3>${legend}${svg}<div class="small">Each month has 2 columns (Col 1, Col 2). “–” = not recorded.</div></div>
 <div class="card"><h3>Location × month</h3><div class="tw">${ht}</div></div>
 <div class="card"><h3>UV lamp failures (by trap)</h3><div class="tw">${ut}</div></div>
 <div class="kpis">
  <div class="kpi"><span>Glue board changed</span><b>${gb}</b><span>times</span></div>
  <div class="kpi"><span>Lamp 1 changed</span><b>${l1}</b><span>times</span></div>
  <div class="kpi"><span>Lamp 2 changed</span><b>${l2}</b><span>times</span></div>
 </div>`;
}

   :`<div class="card">${msg}<h3>Create admin password</h3><div class="small" style="margin-bottom:8px">No password set yet. Create one now (min 4 characters). Only people with this password can edit the form.</div>

 const d=adm.draft;
 const F=(f,l,w)=>`<label class="f" style="${w||''}">${l}<input data-f="${f}" value="${esc(d[f])}"></label>`;
 el.innerHTML=`${msg}
 <div class="card"><h3 style="margin-top:0">Header</h3>

 <div class="card"><h3 style="margin-top:0">Pest categories</h3><div class="g2">${TYPES.map(t=>`<label class="f">${t}<input data-tf="${t}" value="${esc(d.types[t])}"></label>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">UV lamps and notes</h3>
